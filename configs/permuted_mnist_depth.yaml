# Configuration for Permuted MNIST with DEPTH GROWTH enabled
dataset: permuted_mnist
num_tasks: 10
batch_size: 256
max_iter: 5000
lr: 0.001

# Network architecture (initial)
input_dim: 784
hidden_dims: [312, 128]
num_classes: 10

# DEN hyper-parameters
ex_k: 10
l1_lambda: 0.00001
l2_lambda: 0.0001
gl_lambda: 0.001
regular_lambda: 0.5
loss_thr: 0.01
spl_thr: 0.05

# Depth-growth settings (experimental)
depth_growth_enabled: true
depth_growth_interval: 3   # Insert a new hidden layer every 3 tasks

# Training options
device: auto
log_dir: results/permuted_mnist_depth
seed: 1004
